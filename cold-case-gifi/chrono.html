<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Cold case GiFi · Chrono général</title>
<link rel="stylesheet" href="css/cc.css?v=92ecc64a60">
<script src="js/config.js?v=92ecc64a60"></script>
<script src="js/donnees.js?v=92ecc64a60"></script>
<script src="js/commun.js?v=92ecc64a60"></script>
<style>
.chrono-g{text-align:center;padding:30px 20px 10px}
.chrono-g .kick{margin-bottom:6px}
.ecoule{font:400 clamp(90px,17vw,250px)/1 var(--fd);letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:10px 0 6px}
.etat-c{font-size:clamp(16px,1.8vw,24px);font-weight:700;color:var(--ink2);min-height:1.4em}
.etat-c.pause{color:var(--warn)}
.commandes{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:22px 0 10px}
.arrivees{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;max-width:1100px;margin:26px auto 0;padding:0 20px}
@media (max-width:760px){.arrivees{grid-template-columns:1fr}}
.cab{background:var(--paper);border:1px solid var(--line);border-top:3px solid var(--ink);padding:20px 22px;text-align:center}
.cab .nom{font:400 clamp(26px,3vw,40px)/1.1 var(--fd);margin-bottom:8px}
.cab .temps{font:400 clamp(40px,5vw,72px)/1 var(--fd);font-variant-numeric:tabular-nums;min-height:1em}
.cab .rang{font-size:14px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin:8px 0 14px;min-height:1.3em}
.cab.premier{background:var(--okb);border-top-color:var(--ok)}
.cab.premier .rang{color:var(--ok)}
.regle{max-width:900px;margin:26px auto 0;padding:0 20px;text-align:center;color:var(--ink2);font-size:15px}
.reglages{max-width:900px;margin:22px auto 0;padding:0 20px;font-size:14px;color:var(--ink2);text-align:center}
.reglages summary{cursor:pointer;font-weight:700}
</style>
</head>
<body data-sous-titre="Le chrono général · à projeter">
<header id="cc-top"></header>
<main class="wrap large">
  <section class="chrono-g" aria-label="Chrono général">
    <p class="kick">Chrono général de l'enquête</p>
    <div class="ecoule" id="ecoule" role="timer" aria-live="off">0:00:00</div>
    <p class="etat-c" id="etat" aria-live="polite"></p>
    <div class="commandes">
      <button class="btn pri grand" type="button" id="lancer">Lancer l'enquête</button>
      <button class="btn grand" type="button" id="pause" hidden>Pause</button>
    </div>
  </section>
  <section class="arrivees" id="arrivees" aria-label="Arrivées des cabinets"></section>
  <p class="regle">Le premier cabinet qui ouvre toutes ses pièces gagne. Quand un cabinet a trouvé son dernier code, cliquez sur « Arrivée » : son temps est noté.</p>
  <details class="reglages">
    <summary>Réglages</summary>
    <p style="margin-top:10px"><button class="btn petit" type="button" id="raz">Tout remettre à zéro</button> <button class="btn petit" type="button" data-son aria-pressed="false">Activer le son</button></p>
    <p>Pages à projeter à la main, si besoin : <a href="quiz.html">Quiz</a> · <a href="breaking.html">Breaking news</a></p>
  </details>
</main>
<footer id="cc-pied"></footer>
<script>
(function () {
  "use strict";
  var st = CC.get("chrono-general", null) || { debut: null, pause: 0, enPause: null, arrivees: {} };
  st.arrivees = st.arrivees || {};
  function sauver() { CC.set("chrono-general", st); }
  function ecoule(t) {
    if (!st.debut) return 0;
    t = t || Date.now();
    return Math.max(0, t - st.debut - st.pause - (st.enPause ? t - st.enPause : 0));
  }
  function hms(ms) {
    var s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), r = s % 60;
    return h + ":" + (m < 10 ? "0" : "") + m + ":" + (r < 10 ? "0" : "") + r;
  }

  /* Arrivées des cabinets */
  function arrivees() {
    var ordre = [1, 2].filter(function (e) { return st.arrivees[e] != null; }).sort(function (a, b) { return st.arrivees[a] - st.arrivees[b]; });
    CC.$("#arrivees").innerHTML = [1, 2].map(function (e) {
      var t = st.arrivees[e], rang = ordre.indexOf(e);
      return '<div class="cab' + (rang === 0 ? " premier" : "") + '"><div class="nom">' + CC.esc(CC.nomEquipe(e)) + '</div><div class="temps">' + (t != null ? hms(t) : "") +
        '</div><div class="rang">' + (rang === 0 ? "1er · remporte la mission" : rang === 1 ? "2e" : st.debut ? "en enquête" : "") + "</div>" +
        (t != null ? '<button class="btn petit" type="button" data-annuler="' + e + '">Annuler l\x27arrivée</button>'
                   : '<button class="btn pri" type="button" data-arrivee="' + e + '"' + (st.debut ? "" : " disabled") + ">Arrivée de " + CC.esc(CC.nomEquipe(e)) + "</button>") + "</div>";
    }).join("");
  }
  CC.$("#arrivees").addEventListener("click", function (ev) {
    var a = ev.target.closest("[data-arrivee]"), x = ev.target.closest("[data-annuler]");
    if (a) { st.arrivees[a.getAttribute("data-arrivee")] = ecoule(); sauver(); CC.gain(); arrivees(); }
    if (x && confirm("Annuler l\x27arrivée de " + CC.nomEquipe(+x.getAttribute("data-annuler")) + " ?")) { delete st.arrivees[x.getAttribute("data-annuler")]; sauver(); arrivees(); }
  });

  /* Commandes */
  CC.$("#lancer").addEventListener("click", function () { st.debut = Date.now(); st.pause = 0; st.enPause = null; sauver(); CC.bip(880, .2); maj(); arrivees(); });
  CC.$("#pause").addEventListener("click", function () {
    if (st.enPause) { st.pause += Date.now() - st.enPause; st.enPause = null; } else st.enPause = Date.now();
    sauver(); maj();
  });
  CC.$("#raz").addEventListener("click", function () {
    if (!confirm("Remettre le chrono général et les arrivées à zéro ?")) return;
    st = { debut: null, pause: 0, enPause: null, arrivees: {} }; sauver(); maj(); arrivees();
  });

  function maj() {
    CC.$("#ecoule").textContent = hms(ecoule());
    CC.$("#lancer").hidden = !!st.debut;
    CC.$("#pause").hidden = !st.debut;
    CC.$("#pause").textContent = st.enPause ? "Reprendre" : "Pause";
    var e = CC.$("#etat");
    e.className = "etat-c" + (st.enPause ? " pause" : "");
    e.textContent = !st.debut ? "Prêt : cliquez sur « Lancer l'enquête »." : st.enPause ? "En pause" : "L'enquête est en cours";
  }
  maj(); arrivees();
  setInterval(maj, 250);
})();
</script>
</body>
</html>
