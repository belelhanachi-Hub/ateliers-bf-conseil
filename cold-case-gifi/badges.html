<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Cold case GiFi · Badges et palmarès</title>
<link rel="stylesheet" href="css/cc.css">
<script src="js/config.js"></script>
<script src="js/donnees.js"></script>
<script src="js/commun.js"></script>
<style>
h1.h{font:900 clamp(38px,5vw,68px)/1 var(--titre);text-transform:uppercase;color:var(--papier);margin-bottom:6px}
.aide{color:#e5d9bf;margin-bottom:20px}
.bloc > h2{font:900 32px var(--titre);text-transform:uppercase;color:var(--papier);margin:34px 0 14px}
/* Podium */
.podium{display:flex;justify-content:center;align-items:flex-end;gap:30px;min-height:380px;padding:20px 10px 0;background:rgba(0,0,0,.18)}
.marche{width:min(300px,42vw);display:flex;flex-direction:column;align-items:center;gap:8px}
.marche .nom{font:900 clamp(24px,3vw,40px)/1 var(--titre);text-transform:uppercase;color:var(--papier);text-align:center}
.marche .montant{font:900 clamp(26px,3vw,44px)/1 var(--titre);color:var(--kraft)}
.marche .col{width:100%;height:260px;transform-origin:bottom;transform:scaleY(0);background-color:var(--kraft);background-image:var(--bruit),linear-gradient(#d3b27f,#a8854f);
  display:flex;align-items:flex-start;justify-content:center;padding-top:14px;font:900 64px var(--titre);color:var(--encre);border:3px solid #6f5634;border-bottom:0}
.marche.un .col{height:300px}
.marche.deux .col{height:190px}
.gagne{text-align:center;font:900 clamp(24px,3vw,40px)/1.15 var(--titre);color:var(--papier);margin-top:16px;min-height:1.2em}
.gagne small{display:block;font:700 17px/1.4 var(--mono);color:#e5d9bf;margin-top:6px}
/* Badges : cartes qui se retournent */
.badges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
@media (max-width:900px){.badges{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.badges{grid-template-columns:1fr}}
.b-carte{perspective:1200px}
.b-in{position:relative;height:300px;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.3,.7,.3,1)}
.b-carte.tourne .b-in{transform:rotateY(180deg)}
.b-face{position:absolute;inset:0;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18px;gap:8px;border-radius:6px}
.b-dos{background-color:var(--kraft);background-image:var(--bruit),linear-gradient(150deg,#d3b27f,#a8854f);border:3px solid #6f5634;font:900 30px var(--titre);text-transform:uppercase;color:#3b2a12}
.b-recto{transform:rotateY(180deg);background:var(--papier);border:3px solid var(--encre)}
.rond{width:110px;height:110px;border-radius:50%;border:5px double var(--rouge);display:flex;align-items:center;justify-content:center;font:900 17px/1 var(--titre);text-transform:uppercase;color:var(--rouge);padding:10px;transform:rotate(-8deg)}
.b-recto b{font:900 26px/1 var(--titre);text-transform:uppercase}
.b-recto .pour{font:14px/1.35 var(--mono)}
.b-recto .qui{font:700 20px var(--mono);border-top:2px dashed var(--encre);padding-top:6px;min-width:70%}
.b-ctrl{display:flex;gap:6px;margin-top:10px}
.b-ctrl input{flex:1;min-width:0;padding:8px;border:2px solid var(--kraft);background:#fffdf6;font:700 15px var(--mono)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:300}
@media (prefers-reduced-motion:reduce){.b-in{transition:none}}
/* Impression des badges attribués */
.imp{display:none}
@media print{
  .ecran-seul{display:none!important}
  .imp{display:grid;grid-template-columns:1fr 1fr;gap:8mm;padding:10mm}
  .imp .b{border:2pt solid #000;border-radius:3mm;padding:8mm;text-align:center;break-inside:avoid;font-family:var(--mono)}
  .imp .b b{display:block;font:900 24pt var(--titre);text-transform:uppercase;margin:3mm 0}
  .imp .b .r{width:28mm;height:28mm;margin:0 auto;border-radius:50%;border:2.5pt double #b3261e;display:flex;align-items:center;justify-content:center;font:900 12pt var(--titre);color:#b3261e;text-transform:uppercase}
  .imp .b .q{font:700 15pt var(--mono);border-top:1px dotted #000;margin-top:4mm;padding-top:2mm;min-height:10mm}
}
</style>
</head>
<body data-sous-titre="Badges et palmarès · 16h25">
<header id="cc-top"></header>
<main class="wrap ecran-seul">
  <h1 class="h">Palmarès et badges</h1>
  <p class="aide">Le cabinet le plus riche à 16h30 remporte la mission. Six badges individuels : tout le monde peut repartir avec quelque chose. Les noms restent sur cet appareil.</p>

  <section class="bloc">
    <h2>Le podium des cabinets</h2>
    <div class="podium" id="podium"></div>
    <p class="gagne" id="gagne" aria-live="polite"></p>
    <p style="text-align:center;margin-top:14px"><button class="btn pri grand" type="button" id="reveler">Révéler le palmarès</button></p>
  </section>

  <section class="bloc">
    <h2>Les 6 badges</h2>
    <div class="badges" id="badges"></div>
    <p style="margin-top:20px"><button class="btn" type="button" id="imprimer">Imprimer les badges attribués</button></p>
  </section>
</main>
<div class="imp" id="imp"></div>
<canvas id="confetti" aria-hidden="true"></canvas>
<footer id="cc-pied"></footer>
<script>
(function () {
  "use strict";
  var D = CC.data;

  /* ---------- Confettis légers (2 s) ---------- */
  var cv = CC.$("#confetti"), cx = cv.getContext("2d");
  function confettis(x, y) {
    if (CC.reduit()) return;
    cv.width = innerWidth; cv.height = innerHeight;
    var cols = ["#c8a46e", "#b3261e", "#2e7d32", "#f4ecd8", "#1b1b1b"];
    var P = [];
    for (var i = 0; i < 90; i++) P.push({ x: x, y: y, vx: (Math.random() - .5) * 9, vy: -Math.random() * 10 - 3, r: Math.random() * 6.28, vr: (Math.random() - .5) * .3, c: cols[i % cols.length], w: 6 + Math.random() * 6 });
    var t0 = performance.now();
    (function f(t) {
      var dt = t - t0;
      cx.clearRect(0, 0, cv.width, cv.height);
      if (dt > 2000) return;
      cx.globalAlpha = dt > 1500 ? (2000 - dt) / 500 : 1;
      P.forEach(function (p) {
        p.vy += .32; p.x += p.vx; p.y += p.vy; p.r += p.vr;
        cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c; cx.fillRect(-p.w / 2, -p.w / 4, p.w, p.w / 2); cx.restore();
      });
      requestAnimationFrame(f);
    })(t0);
  }

  /* ---------- Podium ---------- */
  var T = CC.get("tresor", { ops: [] }) || { ops: [] };
  function solde(e) { var s = D.tresorerie.solde_initial; (T.ops || []).forEach(function (o) { if (o.e === e) s += o.montant; }); return s; }
  function podium(montrer) {
    T = CC.get("tresor", { ops: [] }) || { ops: [] };
    var s1 = solde(1), s2 = solde(2);
    var ordre = s1 >= s2 ? [1, 2] : [2, 1];
    var pod = CC.$("#podium");
    pod.innerHTML = "";
    // 2e à gauche, 1er à droite… ici 2 cabinets : le premier au centre-droit, plus haut
    [ordre[1], ordre[0]].forEach(function (e) {
      var premier = e === ordre[0] && s1 !== s2;
      var m = CC.el("div", { class: "marche " + (premier || s1 === s2 ? "un" : "deux") });
      m.innerHTML = '<div class="nom">' + CC.esc(CC.nomEquipe(e)) + '</div><div class="montant">' + (montrer ? CC.euros(solde(e)) : "? €") + '</div><div class="col">' + (s1 === s2 ? "1" : premier ? "1" : "2") + "</div>";
      pod.appendChild(m);
    });
    return ordre;
  }
  podium(false);
  CC.$("#reveler").addEventListener("click", function () {
    var b = this; b.disabled = true;
    CC.$("#gagne").textContent = "Roulement de tambour…";
    CC.tambour(2);
    var ordre = podium(false);
    var cols = CC.$$(".marche .col");
    setTimeout(function () {
      ordre = podium(true);
      CC.$$(".marche .col").forEach(function (c, i) {
        CC.anim(c, [{ transform: "scaleY(0)" }, { transform: "scaleY(1)" }], { duration: 1200, delay: i * 250, easing: "cubic-bezier(.2,.8,.3,1)", fill: "forwards" });
      });
      var s1 = solde(1), s2 = solde(2);
      CC.$("#gagne").innerHTML = s1 === s2 ? "Égalité parfaite : " + CC.euros(s1) + " chacun"
        : CC.esc(CC.nomEquipe(ordre[0])) + " remporte la mission<small>avec " + CC.euros(solde(ordre[0])) + ", et 15 minutes de coaching individuel sur le dossier B1 pour chacun de ses membres.</small>";
      var r = CC.$(".marche.un").getBoundingClientRect();
      setTimeout(function () { confettis(r.left + r.width / 2, r.top + 40); }, 900);
      b.disabled = false; b.textContent = "Rejouer le palmarès";
    }, 2000);
  });

  /* ---------- Badges ---------- */
  var noms = CC.get("badges", {}) || {};
  var tournes = {};
  var zone = CC.$("#badges");
  D.badges.forEach(function (b, i) {
    var c = CC.el("div", { class: "b-carte" });
    c.innerHTML = '<div class="b-in"><div class="b-face b-dos" aria-hidden="true">Badge<br>n° ' + (i + 1) + '<span style="font-size:60px">?</span></div>' +
      '<div class="b-face b-recto"><div class="rond">' + CC.esc(b.badge) + "</div><b>" + CC.esc(b.badge) + '</b><span class="pour">' + CC.esc(b.pour) + '</span><span class="qui" data-qui></span></div></div>' +
      '<div class="b-ctrl"><label class="sr" for="bn' + i + '">Décerné à</label><input id="bn' + i + '" placeholder="Décerné à…" maxlength="60" autocomplete="off" value="' + CC.esc(noms[i] || "") + '">' +
      '<button type="button" class="btn petit" data-r>Remettre</button></div>';
    zone.appendChild(c);
    var inp = c.querySelector("input"), qui = c.querySelector("[data-qui]");
    function majQui() { qui.textContent = inp.value.trim() || "…"; }
    majQui();
    inp.addEventListener("input", function () { noms[i] = inp.value; CC.set("badges", noms); majQui(); });
    c.querySelector("[data-r]").addEventListener("click", function () {
      var t = !c.classList.contains("tourne");
      c.classList.toggle("tourne", t);
      this.textContent = t ? "Retourner" : "Remettre";
      if (t) {
        CC.jingle();
        var r = c.getBoundingClientRect();
        setTimeout(function () { confettis(r.left + r.width / 2, r.top + r.height / 3); }, 450);
      }
    });
  });

  CC.$("#imprimer").addEventListener("click", function () {
    CC.$("#imp").innerHTML = D.badges.map(function (b, i) {
      return '<div class="b"><div class="r">' + CC.esc(b.badge) + "</div><b>" + CC.esc(b.badge) + "</b><div>" + CC.esc(b.pour) + '</div><div class="q">' + CC.esc((noms[i] || "").trim()) + "</div><div style=\"font-size:9pt;margin-top:2mm\">Cold case GiFi · " + CC.esc(D.meta.groupe) + "</div></div>";
    }).join("");
    window.print();
  });
})();
</script>
</body>
</html>
